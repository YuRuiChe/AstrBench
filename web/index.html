<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>AstrBench</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>AstrBench</h2>
        <span id="version" class="version"></span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="chat">聊天</a>
        <a href="#" class="nav-item" data-view="plugins">插件列表</a>
        <a href="#" class="nav-item" data-view="settings">设置</a>
      </nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="theme-toggle" title="切换主题">暗色</button>
      </div>
    </aside>

    <main class="content">
      <section class="view" id="view-chat">
        <div class="chat">
          <div class="plugin-bar">
            <label for="plugin-select">当前插件：</label>
            <select id="plugin-select"></select>
            <span class="hint">切换插件会终止当前测试</span>
          </div>

          <div id="chat-log" class="chat-log"></div>

          <div class="input-row">
            <input id="msg-input" type="text" placeholder="输入消息，例如 /hello" autocomplete="off">
            <button id="send-btn">发送</button>
          </div>
        </div>

        <aside class="logs">
          <!-- 日志面板头部：标题 + 级别切换 -->
          <div class="logs-header">
            <h2>运行日志</h2>
            <select id="log-level-select" class="log-level-select" title="日志级别">
              <option value="debug">DEBUG</option>
              <option value="info" selected>INFO</option>
              <option value="warning">WARNING</option>
              <option value="error">ERROR</option>
            </select>
          </div>
          <div id="log-view" class="log-view"></div>
        </aside>
      </section>

      <section class="view" id="view-plugins" hidden>
        <div class="panel">
          <h2>插件列表</h2>
          <div id="plugin-list" class="plugin-list"></div>
        </div>
      </section>

      <section class="view" id="view-settings" hidden>
        <div class="panel">
          <h2>设置</h2>
          <div class="settings-row">
            <label for="theme-select">主题</label>
            <select id="theme-select">
              <option value="dark">暗色</option>
              <option value="light">亮色</option>
            </select>
          </div>
          <div class="settings-row">
            <label>日志轮询间隔</label>
            <span id="poll-interval-info" class="muted"></span>
          </div>
          <div class="settings-row">
            <label>配置文件</label>
            <span id="config-path" class="muted"></span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- log_viewer.js 必须在 app.js 之前加载 -->
  <script src="/components/log_viewer.js"></script>
  <script src="/app.js"></script>
</body>
</html>
