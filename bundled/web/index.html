<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>AstrBench</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/js/marked.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>AstrBench</h2>
        <span id="version" class="version"></span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="chat">测试</a>
        <a href="#" class="nav-item" data-view="plugins">插件列表</a>
        <a href="#" class="nav-item" data-view="settings">设置</a>
      </nav>
      <div class="sidebar-footer">
        <a href="https://github.com/YuRuiChe/AstrBench"
           target="_blank" rel="noopener"
           class="github-link" title="打开 GitHub 仓库">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </aside>

    <main class="content">
      <section class="view" id="view-chat">
        <!-- 顶栏：横跨测试 + 日志 -->
        <div class="topbar">
          <button id="home-btn" class="home-btn" hidden title="返回主页面会终止当前测试">←</button>
          <div class="plugin-bar">
            <label for="plugin-select">当前插件：</label>
            <select id="plugin-select"></select>
            <span class="hint">切换插件会终止当前测试</span>
          </div>
          <button id="theme-toggle" class="theme-toggle" title="切换主题">暗色</button>
        </div>

        <!-- 测试 + 日志并排 -->
        <div class="chat-body">
          <div class="chat">
            <!-- 欢迎页（无插件时显示） -->
            <div id="welcome" class="welcome">
              <div class="welcome-inner">
                <h1>欢迎使用 AstrBench</h1>
                <p>请在上方下拉框选择要调试的插件</p>
                <p>选择插件后即可开始测试</p>
                <p class="welcome-hint">如有不足。欢迎各位提交Issue</p>
              </div>
            </div>

            <!-- 测试页（选插件后显示） -->
            <div id="chat-active" class="chat-active" hidden>
              <div id="chat-log" class="chat-log"></div>
              <div class="input-row">
                <input id="msg-input" type="text" placeholder="输入消息，例如 /hello" autocomplete="off">
                <button id="send-btn">发送</button>
              </div>
            </div>
          </div>

          <aside class="logs">
            <div class="logs-header">
              <h2>运行日志</h2>
              <select id="log-level-select" class="log-level-select" title="日志级别">
                <option value="debug">DEBUG</option>
                <option value="info" selected>INFO</option>
                <option value="warning">WARNING</option>
                <option value="error">ERROR</option>
              </select>
            </div>
            <div id="log-view" class="log-view"></div>
          </aside>
        </div>
      </section>

      <section class="view" id="view-plugins" hidden>
        <div class="panel">
          <h2>插件列表</h2>
          <p class="panel-hint">在测试页顶部下拉框切换插件</p>
          <div id="plugin-list" class="plugin-list"></div>
        </div>
      </section>

      <section class="view" id="view-settings" hidden>
        <div class="panel">
          <h2>设置</h2>
          <div class="settings-row">
            <label for="theme-select">主题</label>
            <select id="theme-select">
              <option value="dark">暗色</option>
              <option value="light">亮色</option>
            </select>
          </div>
          <div class="settings-row">
            <label>日志轮询间隔</label>
            <span id="poll-interval-info" class="muted"></span>
          </div>
          <div class="settings-row">
            <label>配置文件</label>
            <span id="config-path" class="muted"></span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <!-- README 弹窗 -->
  <dialog id="dialog-readme" class="custom-dialog">
    <div class="dialog-header">
      <span class="dialog-title"></span>
      <button class="dialog-close" onclick="this.closest('dialog').close()">✕</button>
    </div>
    <div class="dialog-body markdown-body"></div>
  </dialog>

  <!-- 设置弹窗 -->
  <dialog id="dialog-config" class="custom-dialog">
    <div class="dialog-header">
      <span class="dialog-title"></span>
      <button class="dialog-close" onclick="this.closest('dialog').close()">✕</button>
    </div>
    <div class="dialog-body"></div>
    <div class="dialog-footer">
      <button class="dialog-save btn-primary">保存</button>
    </div>
  </dialog>

  <!-- 行为弹窗 -->
  <dialog id="dialog-behaviors" class="custom-dialog">
    <div class="dialog-header">
      <span class="dialog-title"></span>
      <button class="dialog-close" onclick="this.closest('dialog').close()">✕</button>
    </div>
    <div class="dialog-body"></div>
  </dialog>
  <script src="/components/log_viewer.js"></script>
  <script src="/components/config_form.js"></script>
  <script src="/app.js"></script>
</body>
</html>
